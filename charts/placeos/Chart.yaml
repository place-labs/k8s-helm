apiVersion: v2
name: placeos
description: An Umbrella Chart for PlaceOS and its dependencies

type: application
version: 0.1.0
appVersion: placeos-2.2609.2

dependencies:
# PlaceOS components
  - name: api
    version: 0.1.0
    condition: api.enabled

  - name: auth
    version: 0.1.0
    condition: auth.enabled

  - name: core
    version: 0.1.0
    condition: core.enabled

  - name: dispatch
    version: 0.1.0
    condition: dispatch.enabled

  - name: frontendloader
    version: 0.1.0
    condition: frontendloader.enabled

  - name: triggers
    version: 0.1.0
    condition: triggers.enabled

  - name: staff
    version: 0.1.0
    condition: staff.enabled

  - name: init
    version: 0.1.0
    condition: init.enabled

# Third party helm charts
  # The bitnami common template library. Loaded ahead of the service charts so that
  # every bitnami subchart resolves the modern "common.*" template definitions.
  # (Previously the elasticsearch chart's bundled copy provided this by accident;
  # without it, influxdb's vendored common 1.x shadows the 2.x definitions the
  # redis/postgresql-ha templates require and rendering fails.)
  - name: common
    version: ~2.31.4
    repository: https://charts.bitnami.com/bitnami

  - name: redis
    version: ~20.13.4
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
    # tags: # (optional)
    #   - Tags can be used to group charts for enabling/disabling together
    # alias: (optional) Alias to be used for the chart. Useful when you have to add the same chart multiple times

  - name: influxdb
    version: ~5.3.3
    repository: https://charts.bitnami.com/bitnami
    condition: influxdb.enabled
    # tags: # (optional)
    #   - Tags can be used to group charts for enabling/disabling together
    # alias: (optional) Alias to be used for the chart. Useful when you have to add the same chart multiple times

  - name: mosquitto
    version: ~0.2.0
    repository: https://halkeye.github.io/helm-charts/
    condition: mosquitto.enabled
    # tags: # (optional)
    #   - Tags can be used to group charts for enabling/disabling together
    # import-values: # (optional)
    #   - ImportValues holds the mapping of source values to parent key to be imported. Each item can be a string or pair of child/parent sublist items.
    # alias: (optional) Alias to be used for the chart. Useful when you have to add the same chart multiple times

  - name: postgresql-ha
    version: ~11.2.1
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
    # tags: # (optional)
    #   - Tags can be used to group charts for enabling/disabling together
    alias: postgresql
